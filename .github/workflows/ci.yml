name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The TUI runs on Bun, so the tests do too: they execute the plugin's setup against a
      # mock context and Bun resolves the OpenTUI/Solid JSX the same way the TUI does.
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: npx tsc --noEmit